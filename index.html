            <!-- شريط البحث -->

                    type="text"
                    id="searchInput"
                    placeholder="ابحث عن التطبيق..."
                    class="w-full py-3 px-5 pr-12 rounded-full bg-slate-800 border border-slate-600 focus:border-red-500 focus:ring-2 focus:ring-red-500/50 outline-none transition-all placeholder-slate-500"
                />

            </div>

    <!-- منطقة عرض التطبيقات -->

            <!-- سيتم ملء التطبيقات هنا بواسطة JavaScript -->
        </div>
        
        <!-- رسالة تظهر عند عدم وجود نتائج -->
        <div id="noResults" class="hidden text-center py-20 text-slate-500">
            <p class="text-xl">لا يوجد تطبيق بهذا الاسم</p>
        </div>
    </main>

    <!-- التذييل ومعلومات التواصل -->

                <div class="flex flex-col md:flex-row items-center justify-center gap-4">
                    
                    <a href="https://wa.me/9665380632622" target="_blank" class="flex items-center gap-3 bg-green-600 hover:bg-green-700 px-6 py-3 rounded-xl transition-colors w-full md:w-auto justify-center group">
                        <i data-lucide="message-circle" class="w-6 h-6 group-hover:scale-110 transition-transform"></i>
                        <div class="text-right">

                            <p class="font-bold text-lg" dir="ltr">053 806 32622</p>

                        <i data-lucide="phone" class="w-6 h-6 text-red-500 group-hover:rotate-12 transition-transform"></i>
                        <div class="text-right">
                            <p class="text-xs text-slate-400">اتصل بنا مباشرة</p>
                            <p class="font-bold text-lg" dir="ltr">053 131 22800</p>
                        </div>
                    </a>

            </div>

            <div class="text-slate-600 text-sm mt-8 border-t border-slate-900 pt-6">
                <p>© 2024 فاست لينك - جميع الحقوق محفوظة</p>
                <p class="text-xs mt-1">أفضل خدمة IPTV في المملكة</p>

            {

            {
                id: 7,

                textColor: "text-blue-800",

                img: `./imgs/lionspeed.png`,
            },
            {
                id: 8,
                name: "Android TV 33",
                description: "للشاشات الذكية",
                iconType: "lucide",
                iconValue: "smartphone",
                color: "bg-green-600",
                downloadUrl: "https://5311.uk/apps/a33tv.apk",

            },
            {
                id: 9,
                name: "StarSat Plus",
                description: "ستار سات بلس",

            },
            {
                id: 10,
                name: "Dita 4K",
                description: "جودة 4K حقيقية",
                iconType: "lucide",
                iconValue: "play",
                extraClasses: "text-yellow-400",
                color: "bg-white",
                textColor: "text-slate-900",
                downloadUrl: "https://5311.uk/apps/dltav_6_2.apk",
                img: `./imgs/dlta4k.png`,
            },
            {
                id: 11,
                name: "Blue 4K",
                description: "الأزرق المميز",
                iconType: "lucide",

                extraClasses: "text-blue-600",
                color: "bg-yellow-400",
                textColor: "text-blue-800",
                downloadUrl: "https://5311.uk/apps/Blue4kpro.apk",
                img: `./imgs/blue4kpro.png`,
            },
            // {
            //     id: 12,
            //     name: "Zain 4K",
            //     description: "زين 4K",
            //     iconType: "lucide",
            //     iconValue: "play",
            //     color: "bg-red-900",
            //     downloadUrl: "https://5311.uk/apps/"
            // },
            // {
            //     id: 13,
            //     name: "IPTV+",
            //     description: "الجيل الجديد",
            //     iconType: "text",
            //     iconValue: "+",
            //     color: "bg-white border border-gray-200",
            //     textColor: "text-red-600",
            //     downloadUrl: "https://5311.uk/apps/"
            // },
            {
                id: 14,
                name: "MyHD New",
                description: "الإصدار الجديد",
                iconType: "lucide",
                iconValue: "tv",
                extraClasses: "text-pink-500",
                color: "bg-white",
                textColor: "text-slate-800",
                downloadUrl: "https://5311.uk/apps/MYHD-LION.apk",
                img: `./imgs/MYHDN.png`,
            },
            {
                id: 15,
                name: "YouTube",
                description: "منصة الفيديو العالمية",
                iconType: "lucide",
                iconValue: "youtube",
                color: "bg-red-600",
                textColor: "text-white",
                downloadUrl: "https://5311.uk/apps/YouTubep.apk"
            }
        ];

        const grid = document.getElementById('appsGrid');
        const searchInput = document.getElementById('searchInput');
        const noResults = document.getElementById('noResults');

        // دالة لإنشاء أيقونة التطبيق حسب النوع
        function getIconHtml(app) {
            if (app.iconType === 'lucide') {
                return `<i data-lucide="${app.iconValue}" class="w-10 h-10 ${app.extraClasses || ''}"></i>`;
            } else {
                return `<span class="font-bold ${app.textSize || 'text-3xl'}">${app.iconValue}</span>`;
            }
        }

        // دالة رسم التطبيقات في الصفحة
        function renderApps(apps) {
            grid.innerHTML = ''; // مسح المحتوى الحالي
            
            if (apps.length === 0) {
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
                
                apps.forEach(app => {
                    const card = document.createElement('div');
                    card.className = `group relative bg-slate-800 rounded-2xl overflow-hidden hover:shadow-2xl hover:shadow-red-900/20 transition-all duration-300 transform hover:-translate-y-1 border border-slate-700`;
                    
                    const textColorClass = app.textColor || 'text-white';

                    // التحقق مما إذا كان هناك صورة مخصصة للتطبيق
                    let visualContent;
                    if (app.img) {
                        // إذا وجدت الصورة، اعرضها
                        visualContent = `
                            <img src="${app.img}" alt="${app.name}" 
                                 class="max-h-[80%] max-w-[80%] object-contain drop-shadow-md transform group-hover:scale-110 transition-transform duration-300"
                                 onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" 
                            />
                            <!-- عنصر احتياطي يظهر في حال فشل تحميل الصورة -->
                            <div style="display:none;" class="transform group-hover:scale-110 transition-transform duration-300">
                                ${getIconHtml(app)}
                            </div>
                        `;
                    } else {
                        // إذا لم توجد صورة، اعرض الأيقونة
                        visualContent = `
                            <div class="transform group-hover:scale-110 transition-transform duration-300">
                                ${getIconHtml(app)}
                            </div>
                        `;
                    }

                    card.innerHTML = `
                        <div class="h-32 flex items-center justify-center ${app.color} ${textColorClass}">
                            ${visualContent}
                        </div>
                        <div class="p-5 flex flex-col items-center text-center">
                            <h3 class="font-bold text-lg mb-1">${app.name}</h3>
                            <p class="text-xs text-slate-400 mb-4">${app.description}</p>
                            <a href="${app.downloadUrl}" target="_blank" class="w-full flex items-center justify-center gap-2 bg-slate-700 hover:bg-red-600 text-white py-2 px-4 rounded-lg transition-colors duration-300 font-medium text-sm group-hover:bg-red-600">
                                <i data-lucide="download" class="w-4 h-4"></i>
                                تحميل التطبيق
                            </a>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }
            // إعادة تهيئة الأيقونات لتظهر
            lucide.createIcons();
        }

        // تشغيل دالة البحث عند الكتابة
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = appsData.filter(app => 
                app.name.toLowerCase().includes(term)
            );
            renderApps(filtered);
        });

        // التشغيل الأولي عند فتح الصفحة
        renderApps(appsData);

    </script>
</body>

</html>
