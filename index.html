<!DOCTYPE html>
<html dir="rtl" lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فاست لينك - Fast Link</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #0f172a;
            /* خلفية داكنة مريحة للعين */
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        /* شبكة مرنة تتكيف مع حجم الشاشة */
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            justify-items: center;
        }

        /* للشاشات الكبيرة (التلفزيون) نكبر الأيقونات */
        @media (min-width: 1024px) {
            .apps-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 40px;
            }
        }

        /* تصميم بطاقة التطبيق (صورة فقط) */
        .app-item {
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 20px;
            overflow: hidden;
            border: 4px solid transparent;
            background: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1 / 1;
            width: 100%;
        }

        /* تأثير التركيز عند استخدام الريموت كنترول أو الماوس */
        .app-item:hover,
        .app-item:focus {
            transform: scale(1.1);
            border-color: #dc2626;
            /* لون أحمر عند التحديد */
            box-shadow: 0 0 25px rgba(220, 38, 38, 0.5);
            outline: none;
        }

        .app-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            /* للحفاظ على أبعاد الصورة */
            padding: 10px;
        }

        /* نص بسيط تحت الصورة يظهر فقط عند الحاجة */
        .app-name {
            margin-top: 10px;
            text-align: center;
            font-size: 0.9rem;
            color: #94a3b8;
        }
    </style>
</head>

<body class="text-white">

    <header class="text-center mb-10">
        <h1 class="text-3xl md:text-5xl font-bold">فاست <span class="text-red-600">لينك</span></h1>
        <p class="text-slate-400 mt-2">اختر التطبيق للتحميل المباشر</p>
    </header>

    <main id="appsGrid" class="apps-grid">
    </main>

        //     { name: "Xtream", url: "./apps/XCIPTVPLAYER.apk", img: "./imgs/xciptv.png" }
        // ];

        const grid = document.getElementById('appsGrid');

        appsData.forEach(app => {
            // إنشاء الرابط
            const anchor = document.createElement('a');
            anchor.href = app.url;
            anchor.className = "flex flex-col items-center w-full focus:outline-none";

            // إنشاء حاوية الصورة (البطاقة)
            const card = document.createElement('div');
            card.className = "app-item";
            card.tabIndex = 0; // مهم جداً للتنقل بالريموت

            const img = document.createElement('img');
            img.src = app.img;
            img.alt = app.name;
            // معالجة الخطأ في حال لم تكن الصورة موجودة
            img.onerror = function () {
                this.parentElement.innerHTML = `<span class='font-bold text-xl'>${app.name}</span>`;
            };

            const nameLabel = document.createElement('span');
            nameLabel.className = "app-name";
            nameLabel.innerText = app.name;

            card.appendChild(img);
            anchor.appendChild(card);
            anchor.appendChild(nameLabel);
            grid.appendChild(anchor);

            // دعم زر Enter في التلفزيون
            card.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    window.location.href = app.url;
                }
            });

            // عند النقر بالماوس أو اللمس
            card.addEventListener('click', () => {
                window.location.href = app.url;
            });
        });
    </script>
</body>

</html>
